name: Build engine

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build host engine
        run: bash scripts/build.sh linux-x86_64 dist
      - name: Golden comparison
        run: bash scripts/check-golden.sh dist/vaulttool-linux-x86_64
      - name: Upload host engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-x86_64
          path: dist/vaulttool-linux-x86_64
          if-no-files-found: error

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-aarch64
            packages: gcc-aarch64-linux-gnu
          - target: windows-x86_64
            packages: gcc-mingw-w64-x86-64
          - target: windows-aarch64
            toolchain: llvm-mingw
          - target: android-aarch64
            toolchain: android-ndk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cross compiler
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      # llvm-mingw is the only free PE ARM64 toolchain; MSVC cannot cross-compile and the MinGW
      # gcc packages only ship x86_64.
      - name: Install llvm-mingw
        if: matrix.toolchain == 'llvm-mingw'
        env:
          LLVM_MINGW_VERSION: '20261117'
        run: |
          archive="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSL --retry 3 "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$archive" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "VAULT_CC=$RUNNER_TEMP/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64/bin/aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"
      - name: Install Android NDK
        if: matrix.toolchain == 'android-ndk'
        env:
          ANDROID_NDK_VERSION: r28c
        run: |
          curl -fsSL --retry 3 "https://dl.google.com/android/repository/android-ndk-$ANDROID_NDK_VERSION-linux.zip" \
            -o "$RUNNER_TEMP/ndk.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_ROOT=$RUNNER_TEMP/android-ndk-$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build
        run: bash scripts/build.sh ${{ matrix.target }} dist
      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: dist/vaulttool-*
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build universal engine
        run: bash scripts/build.sh macos-universal dist
      - name: Verify universal binary
        run: lipo -info dist/vaulttool-macos-universal
      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-macos-universal
          path: dist/vaulttool-macos-universal
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download engines
        uses: actions/download-artifact@v4
        with:
          path: engines
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: engines/vaulttool-*
          fail_on_unmatched_files: true
